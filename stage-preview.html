<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Shardfall — stage preview</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font: 12px system-ui, sans-serif; }
      #wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
      canvas { display: block; }
      #ui { position: absolute; left: 8px; top: 8px; display: flex; flex-wrap: wrap; gap: 4px; max-width: 70vw; z-index: 2; }
      #ui button { background: #0008; color: #eee; border: 1px solid #fff4; padding: 3px 7px; cursor: pointer; }
      .dot { position: absolute; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; pointer-events: none; z-index: 3; }
      body.shot #ui, body.shot .dot { display: none; }
    </style>
  </head>
  <body>
    <div id="wrap"><canvas id="c"></canvas></div>
    <div id="ui"></div>
    <script type="module" src="/src/dev/stage-preview.ts"></script>
  </body>
</html>
